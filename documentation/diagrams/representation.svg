<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240"><rect width="100%" height="100%" fill="white"/><text x="20" y="25" fill="#222" font-family="Libertinus Serif" font-size="22" text-anchor="start">A length-two word index and a letter restriction</text><text x="25" y="65" fill="#222" font-family="DejaVu Sans Mono" font-size="16" text-anchor="start">ID      0     1     2     3</text><text x="25" y="98" fill="#222" font-family="DejaVu Sans Mono" font-size="16" text-anchor="start">word   ab    ac    bd    cd</text><rect x="20" y="125" width="300" height="65" rx="5" fill="white" stroke="#245b78" stroke-width="2"/><text x="170.0" y="162.5" fill="#245b78" font-family="Libertinus Serif" font-size="16" text-anchor="middle">D = 1111 (all words)</text><line x1="322" y1="155" x2="450" y2="155" stroke="#666666" stroke-width="1.6"/><text x="342" y="143" fill="#222" font-family="DejaVu Sans Mono" font-size="16" text-anchor="start">AND</text><rect x="453" y="125" width="322" height="65" rx="5" fill="white" stroke="#bc6c25" stroke-width="2"/><text x="614.0" y="162.5" fill="#bc6c25" font-family="Libertinus Serif" font-size="16" text-anchor="middle">D&#x27; = 0011 (ab, ac)</text><text x="420" y="90" fill="#222" font-family="DejaVu Sans Mono" font-size="16" text-anchor="start">M[position 0, a] = 0011</text><text x="25" y="222" fill="#222" font-family="Libertinus Serif" font-size="16" text-anchor="start">Bit order shown most-significant first; each set bit denotes a live word.</text></svg>
