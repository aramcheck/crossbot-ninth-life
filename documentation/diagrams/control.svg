<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400"><rect width="100%" height="100%" fill="white"/><rect x="15" y="30" width="220" height="60" rx="5" fill="white" stroke="#245b78" stroke-width="2"/><text x="125.0" y="65.0" fill="#245b78" font-family="Libertinus Serif" font-size="16" text-anchor="middle">Initial propagation</text><rect x="290" y="30" width="220" height="60" rx="5" fill="white" stroke="#245b78" stroke-width="2"/><text x="400.0" y="65.0" fill="#245b78" font-family="Libertinus Serif" font-size="16" text-anchor="middle">Check deadline / quota</text><rect x="565" y="30" width="220" height="60" rx="5" fill="white" stroke="#245b78" stroke-width="2"/><text x="675.0" y="65.0" fill="#245b78" font-family="Libertinus Serif" font-size="16" text-anchor="middle">Select MRV slot</text><line x1="235" y1="60" x2="290" y2="60" stroke="#666666" stroke-width="1.6"/><line x1="510" y1="60" x2="565" y2="60" stroke="#666666" stroke-width="1.6"/><rect x="565" y="155" width="220" height="60" rx="5" fill="white" stroke="#245b78" stroke-width="2"/><text x="675.0" y="190.0" fill="#245b78" font-family="Libertinus Serif" font-size="16" text-anchor="middle">Sample / order words</text><line x1="675" y1="90" x2="675" y2="155" stroke="#666666" stroke-width="1.6"/><rect x="290" y="155" width="220" height="60" rx="5" fill="white" stroke="#245b78" stroke-width="2"/><text x="400.0" y="190.0" fill="#245b78" font-family="Libertinus Serif" font-size="16" text-anchor="middle">Assign; propagate</text><line x1="565" y1="185" x2="510" y2="185" stroke="#666666" stroke-width="1.6"/><rect x="15" y="155" width="220" height="60" rx="5" fill="white" stroke="#bc6c25" stroke-width="2"/><text x="125.0" y="190.0" fill="#bc6c25" font-family="Libertinus Serif" font-size="16" text-anchor="middle">Success: return fill</text><line x1="290" y1="185" x2="235" y2="185" stroke="#666666" stroke-width="1.6"/><rect x="290" y="280" width="220" height="60" rx="5" fill="white" stroke="#bc6c25" stroke-width="2"/><text x="400.0" y="315.0" fill="#bc6c25" font-family="Libertinus Serif" font-size="16" text-anchor="middle">Failure: restore trail</text><line x1="400" y1="215" x2="400" y2="280" stroke="#666666" stroke-width="1.6"/><line x1="510" y1="310" x2="750" y2="310" stroke="#666666" stroke-width="1.6"/><line x1="750" y1="310" x2="750" y2="215" stroke="#666666" stroke-width="1.6"/><text x="555" y="293" fill="#222" font-family="Libertinus Serif" font-size="16" text-anchor="start">next word</text><line x1="290" y1="310" x2="90" y2="310" stroke="#666666" stroke-width="1.6"/><line x1="90" y1="310" x2="90" y2="235" stroke="#666666" stroke-width="1.6"/><text x="20" y="350" fill="#222" font-family="Libertinus Serif" font-size="16" text-anchor="start">exhausted → backtrack; root exhausted → UNSAT</text><text x="20" y="378" fill="#222" font-family="Libertinus Serif" font-size="16" text-anchor="start">Quota → restore root, double allowance; deadline → TIMEOUT</text></svg>
