[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "crossbot"
version = "0.1.0"
description = "Verified crossword filling with bit-parallel constraint search"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
crossbot = "crossbot.cli:main"
benchmark = "crossbot.benchmark:main"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "types-pyyaml>=6.0",
]

[tool.mypy]
files = ["src"]
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
disallow_any_explicit = true
disallow_subclassing_any = true

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py314"]
